[package]
name = "distillery"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A decision engine: distills docs into key facts, cited by source, confirmed by humans"
repository = "https://github.com/itsrachelfish/distillery"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
