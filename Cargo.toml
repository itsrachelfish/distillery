[package]
name = "distillery"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A decision engine: distills docs into key facts, cited by source, confirmed by humans"
repository = "https://github.com/itsrachelfish/distillery"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
maud = { version = "0.27", features = ["axum"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "net"] }
toml = "1.1"
